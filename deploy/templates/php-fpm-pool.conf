[displanery]
user = deploy
group = deploy
listen = /run/php/php8.4-fpm-displanery.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
php_admin_value[upload_tmp_dir] = /srv/data/tmp/php
php_admin_value[sys_temp_dir] = /srv/data/tmp/php
php_admin_value[upload_max_filesize] = 60M
php_admin_value[post_max_size] = 60M
php_admin_value[expose_php] = Off
