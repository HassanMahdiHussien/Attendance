[program:displanery-worker]
command=/usr/bin/php /srv/displanery/current/artisan queue:work database --queue=imports,assessments,default,summaries --sleep=3 --tries=3 --timeout=900 --max-time=3600
directory=/srv/displanery/current
user=deploy
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/srv/data/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

[program:displanery-worker-extra]
command=/usr/bin/php /srv/displanery/current/artisan queue:work database --queue=assessments,default,summaries --sleep=3 --tries=3 --timeout=900 --max-time=3600
directory=/srv/displanery/current
user=deploy
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=960
redirect_stderr=true
stdout_logfile=/srv/data/storage/logs/worker-extra-%(process_num)02d.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
