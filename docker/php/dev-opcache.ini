; Local development only (mounted by compose.yaml, never used in production).
; Sail serves the app with `php artisan serve`, i.e. the CLI SAPI, where OPcache is off by default.
; On Windows the project is read through Docker's slow drive mount (~3 ms per file check), so every
; request re-reading ~1000 PHP files took 3-7 s. Caching compiled code and re-checking files at most
; every 30 s brings a page to ~0.2 s; an edited file can take up to 30 s to show up.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=30
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
realpath_cache_size=4096K
realpath_cache_ttl=600
; Xdebug is installed in Sail and is incompatible with the JIT; disabling it avoids a warning on every command.
opcache.jit=disable
