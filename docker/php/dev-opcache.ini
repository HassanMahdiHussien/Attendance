; Local development only (mounted by compose.yaml, never used in production).
; Sail serves the app with `php artisan serve`, i.e. the CLI SAPI, where OPcache is off by default.
; The project lives in the WSL2 Linux filesystem, where checking a file is cheap, so OPcache re-checks
; files on every request: edits show up immediately and pages stay around 0.1 s.
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.memory_consumption=512
opcache.max_accelerated_files=50000
; Xdebug is installed in Sail and is incompatible with the JIT; disabling it avoids a warning on every command.
opcache.jit=disable
